<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Website as Parking Lot</title>
<style>
* { box-sizing: border-box; }
body { margin:0; font-family:Arial,sans-serif; background:#2f3133; color:white; }
header { padding:28px 40px; background:#111; }
h1 { margin:0 0 8px; font-size:34px; }
p { margin:0; color:#bbb; }
.lot {
  min-height:calc(100vh - 110px);
  padding:40px;
  display:grid;
  grid-template-columns:repeat(3,minmax(180px,1fr));
  gap:28px;
  background:#4a4d50;
}
.spot {
  min-height:220px;
  border:3px solid #f2f2f2;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
}
.car {
  width:70%;
  height:110px;
  border-radius:30px 30px 30px 30px;
  background:#111;
  border:2px solid white;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:12px;
}
.spot:hover .car { transform:scale(1.04); }
.label { position:absolute; bottom:10px; left:12px; font-size:13px; color:#ddd; }
@media (max-width:760px){ .lot{ grid-template-columns:1fr 1fr; } }
</style>
</head>
<body>
<header>
  <h1>WEBSITE AS PARKING LOT</h1>
  <p>Each parking spot holds a car that I have a personal connection with.</p>
</header>
<main class="lot">
  <div class="spot"><div class="car">CAR 1<br></div><div class="label">01</div></div>
  <div class="spot"><div class="car">CAR 2<br></div><div class="label">02</div></div>
  <div class="spot"><div class="car">CAR 3<br></div><div class="label">03</div></div>
  <div class="spot"><div class="car">CAR 4<br></div><div class="label">04</div></div>
  <div class="spot"><div class="car">CAR 5</div><div class="label">05</div></div>
  <div class="spot"><div class="car">CAR 6<br></div><div class="label">06</div></div>
</main>
</body>
</html>
